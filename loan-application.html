<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">   <!-- Navbar -->
                           
        <div class="logo">
            PrimeMortgage
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="loan-application.html">Apply Loan</a></li>
            <li><a href="calculator.html">EMI Calculator</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="payment-history.html">Payments</a></li>
        </ul>

    </nav>

    <section class="form-container">

        <h2>Mortgage Loan Application</h2>

        <form id="loanForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="form-group">
                <label>CNIC Number</label>
                <input type="text" id="cnic" required>
            </div>

            <div class="form-group">
                <label>Property Value ($)</label>
                <input type="number" id="propertyValue" required>
            </div>

            <div class="form-group">
                <label>Down Payment ($)</label>
                <input type="number" id="downPayment" required>
            </div>

            <div class="form-group">
                <label>Loan Amount ($)</label>
                <input type="number" id="loanAmount" required>
            </div>

            <div class="form-group">
                <label>Loan Term</label>

                <select id="loanTerm">
                    <option>10 Years</option>
                    <option>15 Years</option>
                    <option>20 Years</option>
                    <option>25 Years</option>
                    <option>30 Years</option>
                </select>

            </div>

            <div class="form-group">
                <label>Employment Status</label>

                <select id="employment">

                    <option>Employed</option>
                    <option>Self Employed</option>
                    <option>Business Owner</option>
                    <option>Government Employee</option>

                </select>

            </div>

            <div class="form-group">
                <label>Monthly Income ($)</label>
                <input type="number" id="income" required>
            </div>

            <button type="submit" class="submit-btn">
                Submit Application
            </button>

        </form>

    </section>

    <script src="main.js"></script>

</body>
</html>
