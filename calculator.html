<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            PrimeMortgage
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="loan-application.html">Apply Loan</a></li>
            <li><a href="calculator.html">EMI Calculator</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="payment-history.html">Payments</a></li>
        </ul>

    </nav>

    <!-- EMI Calculator -->

    <section class="form-container">

        <h2>Mortgage EMI Calculator</h2>

        <div class="form-group">
            <label>Loan Amount ($)</label>
            <input type="number" id="loan">
        </div>

        <div class="form-group">
            <label>Interest Rate (%)</label>
            <input type="number" id="rate">
        </div>

        <div class="form-group">
            <label>Loan Term (Years)</label>
            <input type="number" id="years">
        </div>

        <button class="submit-btn" onclick="calculateEMI()">
            Calculate EMI
        </button>

        <br>

        <div class="dashboard-card">

            <h3>Results</h3>

            <p id="monthlyEmi">
                Monthly EMI: -
            </p>

            <p id="totalPayment">
                Total Payment: -
            </p>

            <p id="totalInterest">
                Total Interest: -
            </p>

        </div>

    </section>

    <script src="calculator.js"></script>

</body>
</html>
